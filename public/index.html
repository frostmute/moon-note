<!DOCTYPE html>
<html lang="en" data-theme="moon">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Note — personal knowledge base</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- starfield backdrop -->
  <div id="stars" aria-hidden="true"></div>

  <div id="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark">🌙</span>
          <span class="brand-name">Moon<span class="brand-dim">Note</span></span>
        </div>
        <button id="btn-new" class="btn-icon" title="New note (Ctrl+N)">+</button>
      </div>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M11 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-.7 4.3a6 6 0 1 0-1.4 1.4l3.3 3.3 1.4-1.4z"/></svg>
        <input id="search-input" type="search" placeholder="Search notes…" autocomplete="off" />
      </div>

      <ul id="note-list" class="note-list"></ul>

      <div class="sidebar-foot">
        <button id="btn-graph" class="btn-graph" title="Knowledge graph">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M8 1.5a3 3 0 0 1 .9 5.85 3.2 3.2 0 0 1 2.6 3.15 3 3 0 1 1-3.4-4.45V4.6A3 3 0 0 1 8 1.5zm-3.6 8.5A2.5 2.5 0 1 0 7 12.5a2.5 2.5 0 0 0-2.6-2.5zm7 0a2.5 2.5 0 1 0 2.6 2.5 2.5 2.5 0 0 0-2.6-2.5z"/></svg>
          <span>Knowledge graph</span>
        </button>
        <div id="stats" class="stats"></div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <header class="main-head">
        <div class="title-row">
          <input id="editor-title" class="title-input" type="text" placeholder="Note title…" />
          <div class="head-actions">
            <span id="save-status" class="save-status"></span>
            <div class="view-toggle">
              <button id="btn-edit" class="chip active">Write</button>
              <button id="btn-preview" class="chip">Preview</button>
            </div>
            <button id="btn-save" class="btn-icon" title="Save (Ctrl+S)">💾</button>
            <button id="btn-delete" class="btn-icon danger" title="Delete">🗑</button>
          </div>
        </div>
        <div class="meta-row">
          <input id="editor-folder" class="folder-input" type="text" placeholder="Folder (e.g. Projects/Ideas)" />
          <input id="editor-tags" class="tags-input" type="text" placeholder="tags, comma, separated" />
        </div>
      </header>

      <div class="editor-body">
        <div id="editor-wrap" class="editor-wrap">
          <textarea id="editor-textarea" class="editor" placeholder="Write in Markdown. Link notes with [[Title]]…" spellcheck="false"></textarea>
        </div>
        <div id="preview" class="preview"></div>
      </div>
    </main>

    <!-- ============ RIGHT PANEL ============ -->
    <aside class="right">
      <div id="moon-widget" class="moon-widget"></div>
      <div class="panel">
        <h3 class="panel-title">Backlinks</h3>
        <div id="backlinks" class="backlinks"></div>
      </div>
    </aside>
  </div>

  <!-- ============ GRAPH OVERLAY ============ -->
  <div id="graph-overlay" class="graph-overlay">
    <div class="graph-bar">
      <h2>Knowledge Graph</h2>
      <button id="graph-close" class="btn-icon" title="Close (Esc)">✕</button>
    </div>
    <div id="graph-canvas" class="graph-canvas"></div>
    <div class="graph-hint">Click a node to open · Drag to rearrange · Scroll to zoom</div>
  </div>

  <div id="toasts" class="toasts"></div>

  <!-- libraries -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
